# ─── Listmonk config (v6.2.0) ────────────────────────────────────────────────
# v6 chỉ cần [app] address + [db]. Mọi thứ khác (SMTP, lists, templates, users)
# cấu hình trong Admin UI và lưu trong DB. Xem LISTMONK_SETUP.md.
#
# ⚠️ Super admin KHÔNG còn đặt ở đây nữa (từ v3 đã bỏ admin_username/admin_password).
#    Tạo admin lần chạy ĐẦU bằng env: LISTMONK_ADMIN_USER + LISTMONK_ADMIN_PASSWORD
#    (xem bước 3 trong doc). Password DB cũng đặt qua env (LISTMONK_db__password
#    trong .env.production) — file này KHÔNG chứa secret nên không xung đột khi pull.

[app]
# Nghe trong container; ánh xạ 127.0.0.1:9000 ở docker-compose (Nginx proxy ra ngoài).
address = "0.0.0.0:9000"

[db]
# PostgreSQL trên host VPS (giống dealeg). Tạo DB + user "listmonk" riêng — xem doc.
host     = "host.docker.internal"
port     = 5432
user     = "listmonk"
# password: KHÔNG đặt ở đây — override bằng env LISTMONK_db__password (.env.production)
password = ""
database = "listmonk"

ssl_mode = "disable"
max_open = 25
max_idle = 25
max_lifetime = "300s"

# Không bật params tự động — Listmonk quản lý migration.
params = ""
