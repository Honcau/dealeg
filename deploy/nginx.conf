# ─── Nginx reverse proxy cho dealeg.com ─────────────────────────────────────────
# Đặt file này vào: /etc/nginx/sites-available/dealeg
# Rồi: ln -s /etc/nginx/sites-available/dealeg /etc/nginx/sites-enabled/
#      nginx -t && systemctl reload nginx

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name dealeg.com www.dealeg.com;

    # Cho phép Certbot verify SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect tất cả sang HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dealeg.com www.dealeg.com;

    # SSL certificates (Certbot sẽ tạo)
    ssl_certificate     /etc/letsencrypt/live/dealeg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dealeg.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Redirect www → non-www
    if ($host = www.dealeg.com) {
        return 301 https://dealeg.com$request_uri;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # Proxy tới Next.js container
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        # Timeout dài cho tác vụ chậm (dịch DeepL 11 ngôn ngữ ~2-3 phút)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache static assets
    location /_next/static/ {
        proxy_pass http://localhost:3000;
        proxy_cache_valid 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
