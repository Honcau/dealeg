# ─── Docker Compose cho dealeg.com trên Contabo VPS ─────────────────────────────
# App chạy trong Docker, PostgreSQL cài trực tiếp trên VPS (host)
# App kết nối DB qua host.docker.internal hoặc IP của host

services:
  # ── Next.js app ──────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dealeg-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    # Cho phép container gọi PostgreSQL trên host (127.0.0.1 của VPS)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Chạy migration trước khi start app
    command: >
      sh -c "npx prisma migrate deploy && node server.js"

  # ── Redis (cho scraper queue, tùy chọn) ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: dealeg-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

volumes:
  redis-data:
