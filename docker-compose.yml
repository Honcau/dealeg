# ─── Docker Compose cho dealeg.com trên Contabo VPS ─────────────────────────────
# App chạy trong Docker, PostgreSQL cài trực tiếp trên VPS (host)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Truyền NEXT_PUBLIC_GA_ID vào lúc build (nhúng vào bundle).
        # Đọc từ shell env hoặc .env.production khi chạy docker compose build.
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID}
    image: dealeg-app
    container_name: dealeg-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Fix network ra ngoài: DNS công cộng + ép IPv4 (tránh treo do IPv6)
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - NODE_OPTIONS=--dns-result-order=ipv4first
    # Chỉ chạy app. Migration chạy riêng bằng lệnh (xem DEPLOY_CONTABO.md)
    command: node server.js

  redis:
    image: redis:7-alpine
    container_name: dealeg-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

volumes:
  redis-data:
