# ─── Docker Compose cho dealeg.com trên Contabo VPS ─────────────────────────────
# App chạy trong Docker, PostgreSQL cài trực tiếp trên VPS (host)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Truyền NEXT_PUBLIC_GA_ID vào lúc build (nhúng vào bundle).
        # Đọc từ shell env hoặc .env.production khi chạy docker compose build.
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID}
        # Umami: script + website id nhúng lúc build (client-side). deploy.sh export
        # 2 biến này từ .env.production khi có UMAMI_DATABASE_URL; ":-" tránh cảnh báo
        # "variable is not set" ở các build không dùng Umami.
        NEXT_PUBLIC_UMAMI_SRC: ${NEXT_PUBLIC_UMAMI_SRC:-}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
    image: dealeg-app
    container_name: dealeg-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Fix network ra ngoài: DNS công cộng + ép IPv4 (tránh treo do IPv6)
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - NODE_OPTIONS=--dns-result-order=ipv4first
    # Chỉ chạy app. Migration chạy riêng bằng lệnh (xem DEPLOY_CONTABO.md)
    command: node server.js

  redis:
    image: redis:7-alpine
    container_name: dealeg-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  # ─── Telegram deal-alert bot (grammY) ────────────────────────────────────────
  # Gọi internal API của app qua mạng nội bộ compose (http://app:3000) bằng
  # INTERNAL_API_TOKEN — không cần credential DB. Webhook chỉ mở 127.0.0.1,
  # Nginx proxy https://bot.dealeg.com/telegram/... vào đây. Xem TELEGRAM_BOT_SETUP.md.
  bot:
    # Profile "bot": chỉ chạy khi đã cấu hình BOT_TOKEN (deploy.sh tự bật khi thấy token).
    # Nhờ vậy deploy hiện tại không bị bot crash-loop vì thiếu token.
    profiles: ["bot"]
    build:
      context: ./bot
      dockerfile: Dockerfile
    image: dealeg-bot
    container_name: dealeg-bot
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env.production
    environment:
      - INTERNAL_API_BASE=http://app:3000
      - PORT=8080
    dns:
      - 8.8.8.8
      - 1.1.1.1

  # ─── Listmonk — email list manager (Phase 0) ─────────────────────────────────
  # Backed by PostgreSQL trên host (DB riêng "listmonk"). SMTP (Brevo) cấu hình
  # trong Admin UI. Xem LISTMONK_SETUP.md. Admin/API chỉ mở 127.0.0.1 → Nginx proxy.
  listmonk:
    image: listmonk/listmonk:v6.2.0
    container_name: dealeg-listmonk
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Đọc .env.production để lấy LISTMONK_db__password (override [db] password trong
    # config.toml) — nhờ vậy config.toml không chứa secret, pull không xung đột.
    env_file:
      - .env.production
    environment:
      # Super admin (v6) — chỉ tạo ở lần --install ĐẦU TIÊN. Truyền qua shell:
      #   LISTMONK_ADMIN_USER=admin LISTMONK_ADMIN_PASSWORD=xxx docker compose up -d listmonk
      # Các lần sau chạy bình thường, Listmonk bỏ qua 2 biến này.
      - LISTMONK_ADMIN_USER
      - LISTMONK_ADMIN_PASSWORD
    volumes:
      - ./deploy/listmonk/config.toml:/listmonk/config.toml:ro
    # Tự cài schema lần đầu (idempotent) + upgrade, rồi chạy.
    command: [sh, -c, "./listmonk --install --idempotent --yes --config /listmonk/config.toml && ./listmonk --upgrade --yes --config /listmonk/config.toml && ./listmonk --config /listmonk/config.toml"]

  # ─── Umami — analytics riêng tư, cookieless (chạy SONG SONG với GA) ───────────
  # Backed by PostgreSQL trên host (DB riêng "umami"). Umami tự chạy migration lúc
  # khởi động. Chỉ mở 127.0.0.1:3001 → Nginx proxy https://analytics.dealeg.com.
  # Xem UMAMI_SETUP.md.
  #
  # Profile "umami": chỉ chạy khi .env.production đã có UMAMI_DATABASE_URL
  # (deploy.sh tự bật + export biến). Nhờ vậy khi chưa cấu hình, service KHÔNG
  # chạy → không crash-loop, tốn 0 RAM.
  #
  # KHÔNG dùng env_file: .env.production ở đây — file đó có DATABASE_URL của app,
  # sẽ ghi đè và trỏ Umami nhầm DB. Chỉ nạp đúng biến qua environment (interpolate
  # từ UMAMI_* mà deploy.sh export).
  #
  # Thu thập beacon phải LUÔN bật → giới hạn RAM/CPU cho gọn VPS (chỉnh ở dưới nếu OOM).
  umami:
    profiles: ["umami"]
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: dealeg-umami
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_TYPE=postgresql
      - DATABASE_URL=${UMAMI_DATABASE_URL:-}
      - APP_SECRET=${UMAMI_APP_SECRET:-}
      - DISABLE_TELEMETRY=1
      # Trần heap Node để container gọn (Umami là app Next.js)
      - NODE_OPTIONS=--max-old-space-size=384
    dns:
      - 8.8.8.8
      - 1.1.1.1
    # Trần tài nguyên — tránh Umami ngốn RAM/CPU của VPS. Nâng nếu bị OOM-kill.
    mem_limit: 512m
    cpus: 0.75

volumes:
  redis-data:
